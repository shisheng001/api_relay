# Render Blueprint - api_relay
# 部署命令: render blueprint create render.yaml

services:
  - type: web
    name: api-relay
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PROVIDER
        value: siliconflow
      - key: SF_API_KEY
        sync: false  # 需要手动填写：硅基流动 API Key
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 8000

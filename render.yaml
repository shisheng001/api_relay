# Render Blueprint - api_relay
# 部署: render blueprint create render.yaml

services:
  - type: web
    name: api-relay
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PROVIDER
        value: siliconflow
      - key: SF_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 8000
